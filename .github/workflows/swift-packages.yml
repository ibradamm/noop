# Compile-and-test verification for the reusable Swift packages.
#
# This job intentionally does NOT touch the macOS app target: that build needs
# XcodeGen to generate Strand.xcodeproj and a wired-up test scheme, and the app
# release is produced and anonymized by hand. The packages, by contrast, build
# and test on their own with plain SwiftPM — no Xcode project, no signing, no
# secrets — which makes them a safe, self-contained CI check that leaks nothing.
name: Swift Packages CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - '.github/workflows/swift-packages.yml'
      # Mirror of the note in android.yml: package tests read the ANDROID oracles to catch a one-sided
      # edit, and one reads Strand/Liquid/LiquidCore.swift. Editing only that side would otherwise skip
      # the guard written for exactly that case. Keep in step with what the tests read.
      - 'android/app/src/test/resources/**'
      - 'Strand/Liquid/LiquidCore.swift'
  push:
    branches: [main]
    paths:
      - 'Packages/**'
      - 'Tools/SleepBench/**'
      - 'Tools/SleepPSG/**'
      - 'Tools/Backfill/**'
      - '.github/workflows/swift-packages.yml'
      # Mirror of the note in android.yml: package tests read the ANDROID oracles to catch a one-sided
      # edit, and one reads Strand/Liquid/LiquidCore.swift. Editing only that side would otherwise skip
      # the guard written for exactly that case. Keep in step with what the tests read.
      - 'android/app/src/test/resources/**'
      - 'Strand/Liquid/LiquidCore.swift'
  workflow_dispatch:
    inputs:
      validation_scope:
        description: 'Full suite, or packages touched by the sleep/effort validation batch'
        type: choice
        default: full
        options: [full, effort]
      macos_runner:
        description: 'macOS validation host; Intel is a fallback for arm64 capacity shortages'
        type: choice
        default: macos-15
        options: [macos-15, macos-15-intel]

concurrency:
  group: swift-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-effort:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check Linux Swift toolchain
        run: swift --version
      - name: Build private snapshot-enabled SQLite
        shell: bash
        run: |
          set -euo pipefail
          SQLITE_SNAPSHOT_DIR="$RUNNER_TEMP/noop-sqlite"
          mkdir -p "$SQLITE_SNAPSHOT_DIR"
          curl --retry 3 -fsSLo "$SQLITE_SNAPSHOT_DIR/sqlite.zip" https://sqlite.org/2026/sqlite-amalgamation-3530400.zip
          unzip -p "$SQLITE_SNAPSHOT_DIR/sqlite.zip" sqlite-amalgamation-3530400/sqlite3.c > "$SQLITE_SNAPSHOT_DIR/sqlite3.c"
          unzip -p "$SQLITE_SNAPSHOT_DIR/sqlite.zip" sqlite-amalgamation-3530400/sqlite3.h > "$SQLITE_SNAPSHOT_DIR/sqlite3.h"
          echo "b1dd5d74ec7f29055a6684fa06fb3c2f6821c87dd38f9a458dfd2e8a1db28189  $SQLITE_SNAPSHOT_DIR/sqlite3.c" | sha256sum --check
          cc -shared -fPIC -DSQLITE_ENABLE_SNAPSHOT=1 "$SQLITE_SNAPSHOT_DIR/sqlite3.c" -o "$SQLITE_SNAPSHOT_DIR/libsqlite3.so.0"
          ln -s libsqlite3.so.0 "$SQLITE_SNAPSHOT_DIR/libsqlite3.so"
          echo "SQLITE_SNAPSHOT_DIR=$SQLITE_SNAPSHOT_DIR" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$SQLITE_SNAPSHOT_DIR" >> "$GITHUB_ENV"
      - name: Test protocol, storage and effort on Linux
        shell: bash
        run: |
          set -euo pipefail
          for package in WhoopProtocol WhoopStore StrandAnalytics; do
            swift test --package-path "Packages/$package" -Xcc -I"$SQLITE_SNAPSHOT_DIR" -Xlinker -L"$SQLITE_SNAPSHOT_DIR"
          done

  test:
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(inputs.validation_scope == 'effort' && '["WhoopProtocol","WhoopStore","StrandAnalytics","StrandDesign"]' || '["WhoopProtocol","OuraProtocol","PolarProtocol","WhoopStore","StrandAnalytics","StrandImport","StrandDesign","NoopLocalAccess"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.package }}
        run: swift build
        working-directory: Packages/${{ matrix.package }}

      - name: Test ${{ matrix.package }}
        run: swift test
        working-directory: Packages/${{ matrix.package }}

  # The Tools/ SwiftPM packages, which path-depend on Packages/ above and were built by nothing.
  #
  # SleepBench is the instrument the sleep work is argued with — #934's stage-fraction tables came out of
  # it — and #935 added 13 tests that no job ran. A tool whose numbers decide whether a staging change
  # lands has to keep compiling against the packages it measures, or it bitrots silently and the next
  # person to reach for it finds it broken. Backfill has no tests yet, so it is build-only.
  #
  # SleepPSG has a second, sharper reason to be here. Its variant scores run through a knob-for-knob PORT of
  # `SleepStagerV2`, and its test suite is what proves that port still reproduces the shipped stager
  # label-for-label. Without this job the port drifts the first time someone edits a coefficient, and the
  # tool keeps printing confident numbers about a recipe that no longer exists. The check needs no dataset.
  tools:
    if: inputs.validation_scope != 'effort'
    runs-on: ${{ inputs.macos_runner || 'macos-15' }}
    strategy:
      fail-fast: false
      matrix:
        tool:
          - SleepBench
          - SleepPSG
          - Backfill
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build ${{ matrix.tool }}
        run: swift build
        working-directory: Tools/${{ matrix.tool }}

      # Only SleepBench has a test target; `swift test` on a package without one fails, so it is guarded.
      - name: Test ${{ matrix.tool }}
        run: |
          if grep -q 'testTarget' Package.swift; then
            swift test
          else
            echo "no test target in Tools/${{ matrix.tool }} — build-only"
          fi
        working-directory: Tools/${{ matrix.tool }}
